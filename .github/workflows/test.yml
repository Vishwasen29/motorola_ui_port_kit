
name: OnePlus 9R CPU GPU Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8250
          ref: lineage-24.0
          fetch-depth: 1

      - name: Audit CPU and GPU sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p overclock-audit
          REPORT="$GITHUB_WORKSPACE/overclock-audit/source-report.txt"

          {
            echo "=== Repository and revision ==="
            git remote -v
            git branch --show-current
            git rev-parse HEAD
            git status --short

            echo
            echo "=== CPU frequency definitions ==="
            grep -RInE \
              'cpufreq-hw-epss|qcom,cpufreq|qcom,lut-row-size|opp-hz' \
              arch/arm64/boot/dts drivers/cpufreq drivers/soc/qcom \
              2>/dev/null || true

            echo
            echo "=== GPU frequency definitions ==="
            grep -RInE \
              'qcom,gpu-pwrlevels|qcom,gpu-freq|gpu_freq|gpu_freq_table|gpu-pwrlevel' \
              arch/arm64/boot/dts drivers/gpu/msm techpack \
              2>/dev/null || true

            echo
            echo "=== GPU clock and voltage controls ==="
            grep -RInE \
              'clk_set_rate|dev_pm_opp|opp-microvolt|thermal_pwrlevel|max_pwrlevel' \
              drivers/gpu/msm drivers/clk drivers/cpufreq \
              2>/dev/null || true

            echo
            echo "=== Relevant device-tree files ==="
            find arch/arm64/boot/dts -type f \
              \( -iname '*lemonades*' -o -iname '*kona*' \
                 -o -iname '*sm8250*' \) -print

            echo
            echo "=== Kernel configuration files ==="
            find arch/arm64/configs -type f \
              \( -iname '*kona*' -o -iname '*lemonades*' \) -print
          } > "$REPORT"

          cat "$REPORT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: oneplus9r-overclock-source-audit
          path: overclock-audit/source-report.txt
          if-no-files-found: error
          
