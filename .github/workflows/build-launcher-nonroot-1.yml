name: Build non-root Moto launcher

on:
  workflow_dispatch:
    inputs:
      dump_branch:
        description: "lhotse dump branch"
        default: "user-17-VWL35HV-19-ST9.2-8c0861-release-keys"
      new_package:
        description: "Rename launcher package (blank = keep com.motorola.launcher3)"
        default: ""
      keep_permissions:
        description: "Extra permissions to keep, comma separated"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DUMP_BRANCH: ${{ inputs.dump_branch }}
      NEW_PKG: ${{ inputs.new_package }}
      KEEP_EXTRA: ${{ inputs.keep_permissions }}
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS || 'android123' }}
    steps:
      - name: Tools
        run: |
          mkdir -p "$HOME/tools" work out
          curl -fsSL -o "$HOME/tools/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "Using build-tools: $BT"

      - name: Fetch launcher from dump (sparse)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            -b "$DUMP_BRANCH" https://dumps.tadiphone.dev/dumps/motorola/lhotse.git dump
          cd dump
          git sparse-checkout init --cone
          git sparse-checkout set system_ext/priv-app/Launcher3QuickStep product/app/LauncherConfig
          git checkout
          ls -la system_ext/priv-app/Launcher3QuickStep product/app/LauncherConfig

      - name: Write manifest patcher
        run: |
          cat > patch_manifest.py <<'PY'
          import re, sys, os
          d, new_pkg = sys.argv[1], (sys.argv[2] if len(sys.argv) > 2 else "")
          p = os.path.join(d, "AndroidManifest.xml")
          s = open(p, encoding="utf-8").read()
          pkg = re.search(r'<manifest[^>]*\spackage="([^"]+)"', s).group(1)

          KEEP = {
            "INTERNET","VIBRATE","EXPAND_STATUS_BAR","QUERY_ALL_PACKAGES",
            "SET_WALLPAPER","SET_WALLPAPER_HINTS","RECEIVE_BOOT_COMPLETED",
            "BROADCAST_STICKY","REQUEST_DELETE_PACKAGES","POST_NOTIFICATIONS",
            "READ_EXTERNAL_STORAGE","WRITE_EXTERNAL_STORAGE","ACCESS_NETWORK_STATE",
            "WAKE_LOCK","FOREGROUND_SERVICE","READ_CONTACTS","CALL_PHONE",
            "REORDER_TASKS","GET_TASKS","SCHEDULE_EXACT_ALARM",
          }
          for x in filter(None, os.environ.get("KEEP_EXTRA", "").split(",")):
              KEEP.add(x.strip().replace("android.permission.", ""))

          removed = []
          def perm(m):
              name = re.search(r'android:name="([^"]+)"', m.group(0)).group(1)
              ok = (name.startswith("android.permission.") and name[19:] in KEEP) \
                   or name.startswith("com.android.launcher.permission.") \
                   or name.startswith(pkg + ".permission.")
              if ok:
                  return m.group(0)
              removed.append(name)
              return ""
          s = re.sub(r'<uses-permission(?:-sdk-23)?\b[^>]*/>', perm, s)

          def lib(m):
              t = m.group(0)
              if "android:required" in t:
                  return re.sub(r'android:required="[^"]*"', 'android:required="false"', t)
              return t.replace("<uses-library", '<uses-library android:required="false"', 1)
          s = re.sub(r'<uses-library\b[^>]*/>', lib, s)

          for attr in ("sharedUserId", "sharedUserLabel", "persistent",
                       "coreApp", "requiredSystemPropertyName",
                       "requiredSystemPropertyValue"):
              s = re.sub(r'\s+android:%s="[^"]*"' % attr, "", s)
          s = re.sub(r'<original-package[^>]*/>', "", s)

          if new_pkg:
              s = s.replace('package="%s"' % pkg, 'package="%s"' % new_pkg, 1)

          open(p, "w", encoding="utf-8").write(s)
          print("package:", pkg, "->", new_pkg or pkg)
          print("stripped permissions:")
          for r in removed:
              print("  -", r)
          PY

      - name: Keystore
        run: |
          ok=0
          if [ -n "$KS_B64" ]; then
            if printf '%s' "$KS_B64" | tr -d ' \n\r"\047' | base64 -d > ks.jks 2>/dev/null \
               && keytool -list -keystore ks.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
              ok=1
              echo "Using keystore from secrets."
            else
              echo "::warning::KEYSTORE_B64 or KS_PASS invalid, falling back to a throwaway key."
            fi
          else
            echo "::warning::No KEYSTORE_B64 secret, using a throwaway key."
          fi
          if [ "$ok" = 0 ]; then
            rm -f ks.jks
            keytool -genkeypair -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MotoPort"
          fi

      - name: Patch, rebuild, sign
        run: |
          build() {
            apk="$1"; name="$2"; pkg="$3"
            java -jar "$HOME/tools/apktool.jar" d -f -s "$apk" -o "work/$name"
            python3 patch_manifest.py "work/$name" "$pkg" | tee "out/$name-report.txt"
            java -jar "$HOME/tools/apktool.jar" b "work/$name" --use-aapt2 -o "work/$name-unsigned.apk"
            "$BT/zipalign" -f -p 4 "work/$name-unsigned.apk" "work/$name-aligned.apk"
            "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --out "out/$name.apk" "work/$name-aligned.apk"
            "$BT/apksigner" verify "out/$name.apk"
          }
          build dump/system_ext/priv-app/Launcher3QuickStep/Launcher3QuickStep.apk Launcher3QuickStep "$NEW_PKG"
          build dump/product/app/LauncherConfig/LauncherConfig.apk LauncherConfig ""
          "$BT/aapt2" dump badging out/Launcher3QuickStep.apk | grep -E "package:|sdkVersion|uses-library|launchable" \
            | tee out/launcher-badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moto-launcher-nonroot
          path: out/
